import me.modmuss50.mpp.ReleaseType

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    // Versions come from gradle/libs.versions.toml.
    alias(libs.plugins.moddev.legacyforge)
    alias(libs.plugins.mod.publish)
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// ---------------------------------------------------------------------------
// Repositories. China-friendly mirrors first, official repositories as
// fallback. ModDevGradle adds the remaining required repositories (Mojang
// libraries, etc.) on its own.
// ---------------------------------------------------------------------------
repositories {
    // NeoForge / FancyModLoader artifacts (official CDN of maven.neoforged.net).
    maven {
        name = 'NeoForged-CDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    // BMCLAPI mirror of the Forge/NeoForge mavens (mcp_config, net.minecraftforge:*).
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven/'
    }
    // Upstream MinecraftForge maven.
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    // Aliyun / Tencent mirrors of Maven Central.
    maven {
        name = 'Aliyun-Central'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Tencent-Central'
        url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
    }
    // Parchment mappings (only needed if you re-enable the parchment block below).
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    // Parchment adds readable parameter names while coding. It is disabled by
    // default: maven.parchmentmc.org redirects downloads to Google Storage,
    // which is unreachable from mainland China. Uncomment this block and the
    // parchment_* entries in gradle.properties if you have a working proxy.
    //parchment {
    //    mappingsVersion = project.parchment_mappings_version
    //    minecraftVersion = project.parchment_minecraft_version
    //}

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators. `.cache` is gradle's datagen bookkeeping:
// keep it in git (it speeds datagen up), keep it out of the jar.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
	// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.
	
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // modCompileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // modCompileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // modLocalRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Unit tests (src/test/java). Keep them free of Minecraft classes so they run with plain
    // `gradlew test`; anything that needs a live game belongs in a GameTest instead
    // (src/main/java/.../gametest, run with `gradlew runGameTestServer`).
    testImplementation libs.junit.jupiter

    // Required by the mixin block above: this annotation processor generates the refmap that
    // `reobfJar` needs. Remove it and the build fails with a missing
    // build/mixin/<mod_id>.refmap.json.mappings.tsrg.
    // (Spelled out rather than taken from the version catalog - catalogs cannot express the
    // ":processor" classifier.)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // --- MixinExtras -------------------------------------------------------------------------
    // Bundled with the mod so that every mod using MixinExtras shares one version at runtime
    // instead of shipping conflicting copies (the ecosystem convention on 1.20.1).
    // `common` provides the annotations/injectors at compile time, `forge` is the runtime part,
    // and `jarJar` embeds that runtime jar into our jar (META-INF/jarjar/...).
    implementation libs.mixinextras.common
    annotationProcessor libs.mixinextras.common
    implementation libs.mixinextras.forge
    jarJar libs.mixinextras.forge
}

// Known environment limitation (Windows + non-ASCII project path): gradle hands the test worker its
// classpath through a UTF-8 argument file, but the JVM launcher decodes that file with the system
// ANSI charset. With a path like ...\Documents\开发\mod\... the classpath entries are corrupted and
// every test fails with ClassNotFoundException for its own test class, even though compilation
// succeeded. There is no build-side fix, so skip the tests there with a notice instead of failing
// the build. Running from an ASCII path (e.g. a junction: `mklink /J C:\mcdev "C:\Users\...\开发\mod"`)
// or from CI runs them normally.
def nonAsciiProjectPath = project.projectDir.absolutePath.chars()
        .anyMatch({ int c -> c > 127 } as java.util.function.IntPredicate)

tasks.named('test', Test).configure {
    useJUnitPlatform()
    onlyIf {
        if (nonAsciiProjectPath) {
            logger.lifecycle(":test skipped - project path contains non-ASCII characters ({}). " +
                    "Run the build from an ASCII path or from CI. See build.gradle for details.",
                    project.projectDir)
        }
        !nonAsciiProjectPath
    }
}

// Fail the build when a main-class mixin fails to apply instead of discovering it at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
}

// Mixin: enabled with a refmap. On 1.20.1 the refmap is what rewrites the official (Mojang) names
// used in source to the SRG names the game runs on - without it injections silently fail to apply.
// The config file (src/main/resources/<mod_id>.mixins.json) intentionally has no "refmap" field,
// gradle injects it here.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"

    // Uncomment while debugging a mixin that refuses to apply:
    // debug.verbose = true
    // debug.export = true
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// ---------------------------------------------------------------------------
// Publishing to mod hosting platforms: `gradlew publishMods`
//
//   gradle.properties : curseforge_project_id / modrinth_project_id  (empty = that platform is skipped)
//   environment       : CURSEFORGE_TOKEN / MODRINTH_TOKEN, optional CHANGELOG
//
// Because an empty project id skips the platform, `gradlew build` never needs any token, and
// publishing is opt-in per machine.
// ---------------------------------------------------------------------------
def mcVersionForPublish = project.minecraft_version
def curseforgeProjectId = providers.gradleProperty("curseforge_project_id").getOrElse("").trim()
def modrinthProjectId = providers.gradleProperty("modrinth_project_id").getOrElse("").trim()

publishMods {
    // The jar task's output is the reobfuscated (SRG) jar in build/libs - see the reobfJar task.
    // Never publish build/devlibs, mods built against it crash at runtime.
    file = tasks.named('jar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}"
    version = mod_version
    changelog = providers.environmentVariable("CHANGELOG").getOrElse("See the project page for the changelog.")
    type = ReleaseType.STABLE
    modLoaders.add("forge")

    if (curseforgeProjectId) {
        curseforge {
            projectId = curseforgeProjectId
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            minecraftVersions.add(mcVersionForPublish)
        }
    }

    if (modrinthProjectId) {
        modrinth {
            projectId = modrinthProjectId
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersions.add(mcVersionForPublish)
        }
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
